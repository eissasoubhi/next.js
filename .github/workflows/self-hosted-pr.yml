name: GitHub-hosted PR

on:
  pull_request:
    branches:
      - canary
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: github-hosted-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    if: >-
      github.actor == 'eissasoubhi' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version
          node --version

      - name: Set up Rust
        shell: bash
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show

      - name: Install dependencies
        shell: bash
        env:
          NEXT_SKIP_NATIVE_POSTINSTALL: '1'
        run: pnpm install --frozen-lockfile

      - name: Apply targeted candidate patch
        shell: bash
        run: |
          if [ -f .github/ci/apply-97329-candidate.mjs ]; then
            node .github/ci/apply-97329-candidate.mjs
          fi

      - name: Build native bindings
        shell: bash
        run: pnpm run swc-build-native

      - name: Build Next.js
        shell: bash
        run: pnpm build

      - name: Install Playwright Chromium
        shell: bash
        run: pnpm exec playwright install --with-deps chromium

      - name: Run targeted regression test
        shell: bash
        run: |
          ran_test=false

          if [ -d test/e2e/app-dir/redirect-prefetch-loop ]; then
            ran_test=true
            pnpm test-start test/e2e/app-dir/redirect-prefetch-loop/
          fi

          if [ -d test/production/app-dir/minifier-comma-assignment ]; then
            ran_test=true
            pnpm testonly test/production/app-dir/minifier-comma-assignment/
          fi

          if [ "$ran_test" = false ]; then
            echo "No targeted regression fixture found in this PR; skipping targeted suite."
          fi
