name: Self-hosted PR

on:
  pull_request:
    branches:
      - canary
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: self-hosted-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    if: >-
      github.actor == 'eissasoubhi' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, next]
    timeout-minutes: 90

    steps:
      - name: Reclaim disk space
        shell: bash
        run: |
          echo 'Disk before cleanup:'
          df -h /

          # Remove leftovers from interrupted jobs without deleting the runner itself.
          rm -rf "$RUNNER_WORKSPACE/next.js/node_modules" || true
          rm -rf "$RUNNER_WORKSPACE/next.js/.next" || true
          rm -rf "$RUNNER_WORKSPACE/next.js/test/.next" || true
          rm -rf "$HOME/.cache/ms-playwright" || true
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true

          echo 'Disk after cleanup:'
          df -h /

          available_kb="$(df -Pk / | awk 'NR == 2 { print $4 }')"
          minimum_kb=$((20 * 1024 * 1024))
          if [ "$available_kb" -lt "$minimum_kb" ]; then
            echo "Need at least 20 GiB free before building Next.js; currently $((available_kb / 1024 / 1024)) GiB."
            exit 1
          fi

      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version
          node --version

      - name: Set up Rust
        shell: bash
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show

      - name: Install dependencies
        shell: bash
        env:
          NEXT_SKIP_NATIVE_POSTINSTALL: '1'
        run: pnpm install --frozen-lockfile

      - name: Build native bindings
        shell: bash
        run: pnpm run build-native

      - name: Build Next.js
        shell: bash
        run: pnpm build

      - name: Install Playwright Chromium
        shell: bash
        run: pnpm exec playwright install chromium

      - name: Run redirect prefetch regression test
        shell: bash
        run: |
          if [ -d test/e2e/app-dir/redirect-prefetch-loop ]; then
            pnpm test-start test/e2e/app-dir/redirect-prefetch-loop/
          else
            echo "No redirect-prefetch-loop test in this PR; skipping targeted regression suite."
          fi
