name: Apply 97564 candidate fix

on:
  push:
    paths:
      - '.github/workflows/apply-97564-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/97564-route-handler-rsc-output
          fetch-depth: 0

      - name: Apply minimal Route Handler output fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('packages/next/src/build/adapter/build-complete.ts')
          text = path.read_text()
          old = """          } else {
            outputs.appRoutes.push(output)
            outputs.appRoutes.push({
              ...output,
              pathname: normalizePagePath(output.pathname) + '.rsc',
              id: normalizePagePath(output.pathname) + '.rsc',
            })
          }
"""
          new = """          } else {
            outputs.appRoutes.push(output)
          }
"""
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one candidate block, found {text.count(old)}')
          path.write_text(text.replace(old, new))

      - name: Verify scoped diff
        run: |
          git diff --check
          git diff -- packages/next/src/build/adapter/build-complete.ts
          test "$(git diff --numstat -- packages/next/src/build/adapter/build-complete.ts | awk '{print $1+$2}')" = "5"

      - name: Commit candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/next/src/build/adapter/build-complete.ts
          git commit -m 'fix: avoid RSC twins for app route handlers'
          git push origin HEAD:fix/97564-route-handler-rsc-output

# retrigger candidate application after confirming the regression is genuinely RED
